spring.application.name=billing

# userProfile = 8081, main-video-page = 8082, elkModule = 8083, billing = 8084
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5433/bank
spring.datasource.username=bank
spring.datasource.password=bank
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT: тот же секрет, что у userProfile, задаётся только через окружение
app.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# true - «оплата» без денег (заглушка до подключения ЮKassa). В проде обязательно false
app.billing.stub-payments=${BILLING_STUB_PAYMENTS:true}
