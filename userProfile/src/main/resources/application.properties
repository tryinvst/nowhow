# userProfile = 8081, main-video-page = 8082, elkModule = 8083
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/bank
spring.datasource.username=bank
spring.datasource.password=bank
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool settings (???????????)
springdoc.swagger-ui.url=/openapi.yaml

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-http-form-post-size=500MB
# JWT: секрет общий для всех сервисов, задаётся только через окружение (не меньше 32 символов)
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=30d

# адреса фронтенда, которым разрешены запросы из браузера (через запятую)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# внешний адрес сервиса: из него строятся ссылки на аватары
app.public-url=${USER_PROFILE_PUBLIC_URL:http://localhost:8081}
